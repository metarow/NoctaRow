# ASUS VivoBook X515JA (R565JA), 15,6" FHD-Panel (1920x1080).
# Verdraengt /usr/share/sway/config.d/70-output.conf.
#
# scale 1 (Image-Default) war lesbar, aber auf dem 15,6"-Panel bewusst zu
# klein -- 1.3 gewaehlt. Gezielt auf eDP-1 statt "output *", damit ein
# angesteckter externer Monitor nicht automatisch mitskaliert wird.
output eDP-1 {
    scale 1.3
}

output * adaptive_sync off

# Beamer/Dockingstation deklarativ ueber kanshi.
# Der gesamte String geht an `sh -c`, deshalb das Semikolon in Quotes.
exec_always "pkill -x kanshi; exec kanshi"
