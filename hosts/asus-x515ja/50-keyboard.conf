# ASUS VivoBook X515JA (R565JA).
# Identisch zum Image-Default -- auf dem Gerät verifiziert (swaymsg -t
# get_inputs), hier als Nachweis abgelegt. Siehe docs/22 für den Ablauf.

input "type:keyboard" {
    xkb_layout de
    xkb_variant nodeadkeys
    xkb_options terminate:ctrl_alt_bksp
}

# ELAN1200 Touchpad.
input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
}
