# Lenovo Yoga 920-13IKB, 4K-Variante.
# Verdraengt /usr/share/sway/config.d/70-output.conf

# Fraktionale Skalierung: 3840x2160 -> 2560x1440 logisch.
# scale 2 war ganzzahlig, aber zu grob (Panels/Noctalia wirkten doppelt so
# gross). XWayland-Unschaerfe bewusst in Kauf genommen, siehe
# docs/05-hidpi-und-monitore.md.
output eDP-1 {
    mode 3840x2160@60Hz
    scale 1.5
    scale_filter linear
}

# Externer Monitor / Beamer: erst kanshi entscheiden lassen.
exec_always "pkill -x kanshi; exec kanshi"
