# Noctarow: First-Boot-Auslieferung.
#
# Type C = kopieren, falls Ziel nicht existiert. Ueberschreibt nie.
# Damit ueberleben lokale Anpassungen jedes Image-Update.

d  %h/.config/noctalia            0755 - - -
d  %h/.config/sway/config.d       0755 - - -
d  %h/.config/kanshi              0755 - - -

C  /etc/vconsole.conf             0644 root root - /usr/lib/vconsole.conf.noctarow
