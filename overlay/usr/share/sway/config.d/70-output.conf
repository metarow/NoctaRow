# Noctarow: Ausgabe-Defaults.
#
# Bewusst konservativ: Skalierung 1, damit unbekannte Hardware nicht mit
# einer falschen Annahme startet. Geraetespezifisches gehoert nach
# /etc/sway/config.d/70-output.conf (verdraengt diese Datei).
#
# Beispiel HiDPI: siehe hosts/yoga920/70-output.conf

output * scale 1
output * adaptive_sync off

# Beamer/Dockingstation deklarativ ueber kanshi.
# Der gesamte String geht an `sh -c`, deshalb das Semikolon in Quotes.
exec_always "pkill -x kanshi; exec kanshi"
