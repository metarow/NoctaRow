# Noctarow: statische Tastaturkonfiguration.
#
# Fedora Sway liest XKB-Einstellungen NICHT aus localectl /
# /etc/X11/xorg.conf.d/00-keyboard.conf. Ohne diesen Block bleibt das Layout
# auf "us", egal was im Installer gewaehlt wurde.
#
# Maschinenspezifische Abweichung: gleichnamige Datei nach
# /etc/sway/config.d/50-keyboard.conf legen. Sie verdraengt diese hier.

input "type:keyboard" {
    xkb_layout de
    xkb_variant nodeadkeys
    xkb_options terminate:ctrl_alt_bksp
    repeat_delay 300
    repeat_rate 30
}
